<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Мессенджер</title>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: #f4f5f7; color: #1c1e21; }
  .center { min-height: 100vh; display: grid; place-items: center; }
  .card { background: #fff; padding: 24px; border-radius: 12px; width: 360px; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
  h2 { margin: 0 0 16px; font-size: 18px; }
  input, textarea, button { font: inherit; }
  input, textarea { width: 100%; padding: 10px; border: 1px solid #d0d3d8; border-radius: 8px; margin-bottom: 10px; }
  button { padding: 9px 14px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
  button.ghost { background: #e8eaee; color: #1c1e21; }
  .link { background: none; color: #2563eb; padding: 0; margin-top: 10px; text-decoration: underline; }
  .hint { font-size: 12px; color: #6b7280; margin: -6px 0 10px; }
  #error { color: #b91c1c; font-size: 13px; min-height: 18px; margin: 0; }

  #app { display: flex; height: 100vh; }
  #sidebar { width: 280px; border-right: 1px solid #e3e5e9; background: #fff; display: flex; flex-direction: column; }
  .me { padding: 12px; border-bottom: 1px solid #e3e5e9; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .me-name { font-weight: 600; font-size: 14px; }
  .me-tag { font-size: 12px; color: #6b7280; }
  .icon-btn { background: #e8eaee; color: #1c1e21; padding: 4px 8px; font-size: 12px; }
  #profile { padding: 12px; border-bottom: 1px solid #e3e5e9; background: #fafbfc; }
  .search { padding: 10px 12px; border-bottom: 1px solid #e3e5e9; }
  .search input { margin: 0; }
  .scroll { overflow: auto; flex: 1; }
  .section-title { padding: 10px 12px 4px; font-size: 12px; color: #6b7280; text-transform: uppercase; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #f0f1f3; }
  .list li:hover { background: #f4f5f7; }
  .list li.active { background: #e6efff; }
  .u-name { display: block; }
  .u-tag { display: block; font-size: 12px; color: #6b7280; }
  #search-results { border-bottom: 1px solid #e3e5e9; }

  #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chat-header { padding: 12px; border-bottom: 1px solid #e3e5e9; background: #fff; font-weight: 600; }
  #messages { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 70%; padding: 8px 12px; border-radius: 12px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.06); word-wrap: break-word; }
  .msg.mine { align-self: flex-end; background: #2563eb; color: #fff; }
  .msg .time { display: block; font-size: 11px; opacity: .6; margin-top: 4px; }
  .empty { color: #6b7280; margin: auto; }
  #composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e3e5e9; background: #fff; }
  #composer textarea { margin: 0; resize: none; height: 44px; }
</style>
</head>
<body>

<div id="auth" class="center">
  <div class="card">
    <h2 id="auth-title">Вход</h2>
    <input id="email" type="email" placeholder="email" autocomplete="username" />
    <div id="reg-fields" hidden>
      <input id="username" placeholder="username" autocomplete="off" />
      <p class="hint">Латиница, цифры и подчёркивание, от 3 символов, начинается с буквы</p>
      <input id="display-name" placeholder="Как вас показывать" autocomplete="off" />
    </div>
    <input id="password" type="password" placeholder="пароль" autocomplete="current-password" />
    <button id="btn-submit" style="width:100%">Войти</button>
    <button id="btn-mode" class="link">Нет аккаунта? Зарегистрироваться</button>
    <p id="error"></p>
  </div>
</div>

<div id="app" hidden>
  <aside id="sidebar">
    <div class="me">
      <div>
        <span class="me-name" id="me-name"></span>
        <span class="me-tag" id="me-tag"></span>
      </div>
      <div style="display:flex; gap:6px">
        <button id="btn-profile" class="icon-btn">Профиль</button>
        <button id="btn-logout" class="icon-btn">Выйти</button>
      </div>
    </div>

    <form id="profile" hidden>
      <input id="p-display" placeholder="Отображаемое имя" />
      <input id="p-username" placeholder="username" />
      <button type="submit" style="width:100%">Сохранить</button>
      <p id="p-error" style="color:#b91c1c; font-size:12px; min-height:16px; margin:6px 0 0"></p>
    </form>

    <form class="search" id="search-form">
      <input id="search-input" placeholder="Найти по username" autocomplete="off" />
    </form>

    <div class="scroll">
      <div id="search-results" hidden></div>
      <div class="section-title">Диалоги</div>
      <ul class="list" id="chats"></ul>
    </div>
  </aside>

  <main id="chat">
    <div id="chat-header">Найдите собеседника через поиск</div>
    <div id="messages"></div>
    <form id="composer" hidden>
      <textarea id="text" placeholder="Сообщение… Enter — отправить"></textarea>
      <button type="submit">Отправить</button>
    </form>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);

let token = localStorage.getItem("token");
let me = null;
let peer = null;
let poll = null;
let isRegisterMode = false;
let chats = new Map();

async function api(path, { method = "GET", body } = {}) {
  const headers = {};
  if (body !== undefined) headers["Content-Type"] = "application/json";
  if (token) headers["Authorization"] = "Bearer " + token;

  const res = await fetch(path, {
    method,
    headers,
    body: body === undefined ? undefined : JSON.stringify(body),
  });

  const raw = await res.text();
  let data = null;
  try { data = raw ? JSON.parse(raw) : null; } catch { data = raw; }

  if (!res.ok) {
    if (res.status === 401) logout();
    throw new Error(describeError(data, res));
  }
  return data;
}

function describeError(data, res) {
  const detail = data && data.detail;
  if (typeof detail === "string") return detail;
  if (Array.isArray(detail)) return detail.map((e) => e.msg).join("; ");
  return res.statusText || "Неизвестная ошибка";
}

function setMode(register) {
  isRegisterMode = register;
  $("reg-fields").hidden = !register;
  $("auth-title").textContent = register ? "Регистрация" : "Вход";
  $("btn-submit").textContent = register ? "Создать аккаунт" : "Войти";
  $("btn-mode").textContent = register
    ? "Уже есть аккаунт? Войти"
    : "Нет аккаунта? Зарегистрироваться";
  $("error").textContent = "";
}

$("btn-mode").onclick = () => setMode(!isRegisterMode);

$("btn-submit").onclick = async () => {
  $("error").textContent = "";
  const email = $("email").value;
  const password = $("password").value;

  try {
    if (isRegisterMode) {
      await api("/app/users/reg", {
        method: "POST",
        body: {
          email,
          password,
          username: $("username").value,
          display_name: $("display-name").value,
        },
      });
    }
    const data = await api("/app/users/auth", {
      method: "POST",
      body: { email, password },
    });
    token = data.access_token;
    localStorage.setItem("token", token);
    await start();
  } catch (e) {
    $("error").textContent = e.message;
  }
};

async function start() {
  me = await api("/app/users/me");
  renderMe();
  $("auth").hidden = true;
  $("app").hidden = false;
  renderChats();
}

function renderMe() {
  $("me-name").textContent = me.display_name;
  $("me-tag").textContent = "@" + me.username;
  $("p-display").value = me.display_name;
  $("p-username").value = me.username;
}

$("btn-profile").onclick = () => {
  $("profile").hidden = !$("profile").hidden;
  $("p-error").textContent = "";
};

$("profile").onsubmit = async (e) => {
  e.preventDefault();
  $("p-error").textContent = "";
  try {
    me = await api("/app/users/me", {
      method: "PATCH",
      body: {
        display_name: $("p-display").value,
        username: $("p-username").value,
      },
    });
    renderMe();
    $("profile").hidden = true;
  } catch (err) {
    $("p-error").textContent = err.message;
  }
};

function renderChats() {
  const ul = $("chats");
  ul.innerHTML = "";
  if (chats.size === 0) {
    const li = document.createElement("li");
    li.textContent = "Найдите собеседника через поиск";
    li.style.cursor = "default";
    li.style.color = "#6b7280";
    ul.appendChild(li);
    return;
  }
  chats.forEach((u) => {
    const li = document.createElement("li");
    const name = document.createElement("span");
    name.className = "u-name";
    name.textContent = u.display_name;
    const tag = document.createElement("span");
    tag.className = "u-tag";
    tag.textContent = "@" + u.username;
    li.append(name, tag);
    if (peer && peer.id === u.id) li.classList.add("active");
    li.onclick = () => openDialog(u);
    ul.appendChild(li);
  });
}

function renderSearchResults(results) {
  const box = $("search-results");
  box.innerHTML = "";
  box.hidden = false;
  if (results.length === 0) {
    const p = document.createElement("div");
    p.className = "section-title";
    p.textContent = "Никого не найдено";
    box.appendChild(p);
    return;
  }
  const ul = document.createElement("ul");
  ul.className = "list";
  results.forEach((u) => {
    const li = document.createElement("li");
    const name = document.createElement("span");
    name.className = "u-name";
    name.textContent = u.display_name;
    const tag = document.createElement("span");
    tag.className = "u-tag";
    tag.textContent = "@" + u.username;
    li.append(name, tag);
    li.onclick = () => {
      clearSearch();
      openDialog(u);
    };
    ul.appendChild(li);
  });
  box.appendChild(ul);
}

function clearSearch() {
  $("search-input").value = "";
  $("search-results").hidden = true;
  $("search-results").innerHTML = "";
}

$("search-form").onsubmit = async (e) => {
  e.preventDefault();
  const q = $("search-input").value.trim();
  if (!q) return;
  try {
    const results = await api(`/app/users/search?query=${encodeURIComponent(q)}`);
    renderSearchResults(results);
  } catch (err) {
    alert(err.message);
  }
};

function openDialog(user) {
  chats.set(user.id, user);
  peer = user;
  renderChats();
  $("chat-header").textContent = user.display_name + " @" + user.username;
  $("composer").hidden = false;
  $("messages").innerHTML = "";
  loadMessages();
  clearInterval(poll);
  poll = setInterval(loadMessages, 2000);
}

async function loadMessages() {
  if (!peer) return;
  const list = await api(`/app/messages/dialog/${peer.id}`);
  const box = $("messages");
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;

  box.innerHTML = "";
  if (list.length === 0) {
    const d = document.createElement("div");
    d.className = "empty";
    d.textContent = "Сообщений пока нет";
    box.appendChild(d);
  }
  for (const m of list) {
    const d = document.createElement("div");
    d.className = "msg" + (m.sender_id === me.id ? " mine" : "");
    d.textContent = m.text;
    const t = document.createElement("span");
    t.className = "time";
    t.textContent = new Date(m.created_at).toLocaleString();
    d.appendChild(t);
    box.appendChild(d);
  }
  if (atBottom) box.scrollTop = box.scrollHeight;
}

function logout() {
  token = null; me = null; peer = null; chats = new Map();
  localStorage.removeItem("token");
  clearInterval(poll);
  $("app").hidden = true;
  $("auth").hidden = false;
  $("profile").hidden = true;
  clearSearch();
  setMode(false);
}

$("btn-logout").onclick = logout;

$("composer").onsubmit = async (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text || !peer) return;
  $("text").value = "";
  try {
    await api("/app/messages", {
      method: "POST",
      body: { recipient_id: peer.id, text },
    });
    await loadMessages();
  } catch (err) {
    alert(err.message);
  }
};

$("text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    $("composer").requestSubmit();
  }
});

(async function init() {
  setMode(false);
  if (!token) return;
  try { await start(); } catch { logout(); }
})();
</script>
</body>
</html>
